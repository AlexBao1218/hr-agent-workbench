[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hr-ai-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "openai>=2,<3", "langgraph>=1,<2", "pydantic>=2,<3", "python-dotenv>=1,<2", "httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
[tool.setuptools.packages.find]
include = ["hr_backend*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
